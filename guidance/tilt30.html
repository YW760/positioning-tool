<h2>30°側方傾斜位</h2>
<ol>
<li>患者を仰臥位から側方へ傾け、身体をおおむね30°側方へ傾斜させます。</li>
<li>肩・骨盤・体幹の向きを確認し、局所的な圧迫や不要なねじれが生じないよう整えます。</li>
<li>枕やクッションなどを使用して、傾斜した姿勢を安定して保持できるようにします。</li>
<li>患者の状態と安楽性を確認し、ポジショニングが完了した時点で左側のカメラ映像で姿勢を確認します。</li>
</ol>
<div class="point"><b>確認：</b>「30°」は医学的な目標の選択項目です。個別の患者に適した姿勢は状態に応じて判断してください。</div>
